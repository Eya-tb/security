# Configuration de la base de données
spring.datasource.url=jdbc:mysql://localhost:3308/bank?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=true
spring.datasource.username=root
spring.datasource.password=0000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# Configuration JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.jakarta.persistence.validation.mode=none

# Exclusion de configurations automatiques non nécessaires
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Initialisation du schéma
spring.sql.init.mode=always

# Configuration du serveur
server.port=8080
server.tomcat.max-threads=200
server.connection-timeout=5s

# Sécurité
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

# Configuration des logs
logging.level.root=WARN
logging.level.org.springframework=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=INFO
logging.level.com.example.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Configuration du service d'horodatage (TSA)
tsa.url=http://freetsa.org/tsr
tsa.connect-timeout=15000
tsa.read-timeout=30000

# Configuration JWT
app.jwt.secret=votreCleSecreteDevraitEtreLonguePourDesRaisonsDeSecurite
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Configuration de sécurité pour les tentatives de connexion
login.max-attempts=5
login.blocking-period-minutes=30

# Configuration email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ayatebib.at@gmail.com
spring.mail.password=ewnodvlgwiwavofv
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.connectiontimeout=5000

# Configuration de la réinitialisation de mot de passe
app.password-reset.expiration-minutes=30

# URL du frontend
app.frontend.url=http://localhost:4200

# Configuration MFA/2FA
app.mfa.issuer=SecureSignature
app.mfa.algorithm=SHA256
app.mfa.digits=6
app.mfa.period=30